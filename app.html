<!DOCTYPE html>
<html>
<head>
  <title>Мои Покупки</title>
  <link href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet"> <!-- -->
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
</head>
<body>
	<header>
		<h1>Мои Покупки</h1>
		<!-- Навигация app.html -->
		<nav class="app-nav">
			<button id="add-purchase-btn" class="btn-primary">+ Новая покупка</button>
			<button id="refresh-btn" class="btn-secondary">🔄 Обновить</button>
			<button onclick="window.location.href='stats.html'" class="btn-secondary">📈 Статистика</button>
			<button onclick="window.location.href='charts.html'" class="btn-secondary">📊 Графики</button>
			<!-- Кнопка специального анализа цен -->
			<button onclick="window.location.href='price-analysis.html'" class="btn-secondary">💰 Анализ цен</button>
			<button onclick="window.location.href='admin.html'" class="btn-secondary">⚙️ Админ-панель</button>
			<button id="logout-btn" class="btn-secondary">Выйти</button>
		</nav>
		
		<!-- Панель экспорта отфильтрованных данных: -->
		<div class="export-panel">
			<div class="export-dropdown">
				<button class="btn-export-dropdown" id="export-button">
					📥 Экспорт данных
					<span class="caret">▼</span>
				</button>
				<div class="export-menu" id="export-menu" style="display: none;">
					<div class="export-menu-header">
						<strong>Формат экспорта</strong>
					</div>
					<button class="export-option" data-format="csv">
						📊 CSV (Excel)
						<small>Совместимость с Excel</small>
					</button>
					<button class="export-option" data-format="xls">
						📈 XLS (Excel)
						<small>Формат Excel</small>
					</button>
					<button class="export-option" data-format="json">
						📋 JSON
						<small>Для программистов</small>
					</button>
					<button class="export-option" data-format="sql">
						🗄️ SQL
						<small>Бэкап базы данных</small>
					</button>
					
					<div class="export-menu-header">
						<strong>Настройки</strong>
					</div>
					
					<div class="export-settings">
						<label class="export-checkbox">
							<input type="checkbox" id="export-headers" checked>
							Включить заголовки
						</label>
						
						<label class="export-checkbox">
							<input type="checkbox" id="export-filters" checked>
						Только отфильтрованные
						</label>
						
						<label class="export-checkbox" id="truncate-option" style="display: none;">
							<input type="checkbox" id="export-truncate">
							Очистить таблицу перед вставкой
						</label>
					</div>
					
					<div class="export-actions">
						<button class="btn-primary" id="start-export">Экспортировать</button>
						<button class="btn-secondary" id="close-export-menu">Отмена</button>
					</div>
				</div>
			</div>
		</div>
		
		<!-- Основные фильтры: -->
		<div class="filters-panel">
			<!-- Категории -->
			<div class="filter-group">
				<label>Фильтр по категориям:</label>
				<select id="category-filter">
					<option value="">Все категории</option>
				</select>
			</div>
			<!-- Даты: -->
			<div class="filter-group">
				<!-- Период "с ..." -->
				<label>Период с ...</label>
				<input type="date" id="date-from" placeholder="С">
			</div>
			<div class="filter-group">
				<!-- Период "... по" -->
				<label>Период по ...</label>
				<input type="date" id="date-to" placeholder="По">
			</div>
			<!-- Магазины -->
			<div class="filter-group">
				<label>Фильтр по магазинам:</label>
				<select id="store-filter">
					<option value="">Все магазины</option>
				</select>
			</div>
			<div>
				<button id="apply-filters" class="btn-secondary">Применить</button>
				<button id="reset-filters" class="btn-secondary">Сбросить</button>
				<button id="clear-all-filters" class="btn-secondary" title="Очистить все фильтры">🗑️ Сбросить интерактивность</button>
			</div>
		</div>
		
		<!-- После панели фильтров -->
		<div id="active-filters-info" style="
			display: none;
			background: #e3f2fd;
			padding: 8px 12px;
			margin: 10px 0;
			border-radius: 4px;
			border-left: 4px solid #2196f3;
			font-size: 14px;
		">
			<!-- Будет заполняться динамически -->
		</div>
	</header>
	
	<main>
		<!-- Информационная динамическая панель -->
		<div class="table-info-panel" id="table-info-panel">
			<div class="info-left">
				<span id="table-status">Все данные</span>
				<div id="active-filters-info" class="active-filters"></div>
			</div>
			<div class="info-right">
				<div class="info-item">
					<span class="info-label">Покупок:</span>
					<span class="info-value" id="total-rows">0</span>
				</div>
				<div class="info-item">
					<span class="info-label">Расход:</span>
					<span class="info-value" id="total-amount">0.00 ₽</span>
				</div>
				<div class="info-item">
					<span class="info-label">Средний чек:</span>
					<span class="info-value" id="avg-amount">0.00 ₽</span>
				</div>
			</div>
		</div>
		
		<!-- Основная таблица покупок - заполняется динамически -->
		<div id="purchases-table"></div>
		<div id="loading">Загрузка данных...</div>
	</main>
  
  <script type="text/javascript" src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/filters_test.js"></script>
  <script src="js/stats.js"></script>
  <script>
	document.getElementById('clear-all-filters').addEventListener('click', function() {
		if (window.purchasesTable) {
			window.purchasesTable.clearFilter();
		}
		clearChartFilter();
		
		// Удаляем баннер фильтра если есть
		const banner = document.getElementById('applied-filter-banner');
		if (banner) banner.remove();
		
		// Показываем сообщение
		showToast('Все фильтры очищены');
	});
	
	// Инициализация экспорта
	document.addEventListener('DOMContentLoaded', function() {
		setupExportControls();
	});
	
	// Фильтры
	function showToast(message) {
		const toast = document.createElement('div');
		toast.textContent = message;
		toast.style.cssText = `
			position: fixed;
			bottom: 20px;
			right: 20px;
			background: #27ae60;
			color: white;
			padding: 10px 20px;
			border-radius: 4px;
			z-index: 1000;
			animation: fadeInOut 3s ease-in-out;
		`;
		
		const style = document.createElement('style');
		style.textContent = `
			@keyframes fadeInOut {
				0% { opacity: 0; transform: translateY(20px); }
				10% { opacity: 1; transform: translateY(0); }
				90% { opacity: 1; transform: translateY(0); }
				100% { opacity: 0; transform: translateY(20px); }
			}
		`;
		document.head.appendChild(style);
		
		document.body.appendChild(toast);
		
		setTimeout(() => {
			if (toast.parentNode) {
				toast.parentNode.removeChild(toast);
			}
		}, 3000);
	}
	
	// Логика работы экспорта данных
	function setupExportControls() {
    const exportButton = document.getElementById('export-button');
    const exportMenu = document.getElementById('export-menu');
    const closeButton = document.getElementById('close-export-menu');
    const startButton = document.getElementById('start-export');
    const formatOptions = document.querySelectorAll('.export-option');
    const truncateOption = document.getElementById('truncate-option');
    
    let currentFormat = 'csv';
    
    // Открытие/закрытие меню
    exportButton.addEventListener('click', function(e) {
        e.stopPropagation();
        const isVisible = exportMenu.style.display !== 'none';
        exportMenu.style.display = isVisible ? 'none' : 'block';
    });
    
    // Закрытие при клике вне меню
    document.addEventListener('click', function(e) {
        if (!exportMenu.contains(e.target) && e.target !== exportButton) {
            exportMenu.style.display = 'none';
        }
    });
    
    // Закрытие по кнопке
    closeButton.addEventListener('click', function() {
        exportMenu.style.display = 'none';
    });
    
    // Выбор формата
    formatOptions.forEach(option => {
        option.addEventListener('click', function() {
            const format = this.dataset.format;
            currentFormat = format;
            
            // Подсветка выбранного
            formatOptions.forEach(opt => opt.style.background = 'white');
            this.style.background = '#f0f7ff';
            
            // Показываем дополнительные опции для SQL
            truncateOption.style.display = format === 'sql' ? 'block' : 'none';
        });
    });
    
    // Запуск экспорта
    startButton.addEventListener('click', async function() {
        exportMenu.style.display = 'none';
        
        // Получаем данные для экспорта
        const data = await getDataForExport();
        
        if (!data || data.length === 0) {
            alert('Нет данных для экспорта');
            return;
        }
        
        // Получаем настройки
        const includeHeaders = document.getElementById('export-headers').checked;
        const onlyFiltered = document.getElementById('export-filters').checked;
        const truncateFirst = document.getElementById('export-truncate')?.checked || false;
        
        // Показываем индикатор загрузки
        showLoadingIndicator(`Экспорт ${data.length} записей...`);
        
        // Выполняем экспорт
        try {
            const filename = dataExporter.generateFilename('shopping_list');
            
            dataExporter.export(data, {
                format: currentFormat,
                filename: filename,
                headers: includeHeaders,
                tableName: 'shops',
                truncateFirst: truncateFirst,
                separator: currentFormat === 'xls' ? '\t' : ';',
                decimalSeparator: ',',
                pretty: true
            });
        } catch (error) {
            console.error('Ошибка экспорта:', error);
            alert('Ошибка при экспорте данных');
        } finally {
            hideLoadingIndicator();
        }
    });
}

	/**
	 * Получение данных для экспорта
	 */
	async function getDataForExport() {
		// Если есть таблица Tabulator и включен фильтр "только отфильтрованные"
		const onlyFiltered = document.getElementById('export-filters').checked;
		
		if (onlyFiltered && window.purchasesTable) {
			// Получаем отфильтрованные данные из таблицы
			return window.purchasesTable.getData('active');
		} else {
			// Иначе получаем все данные через API
			try {
				const response = await apiClient.getPurchases();
				return response;
			} catch (error) {
				console.error('Ошибка загрузки данных:', error);
				return [];
			}
		}
	}

	/**
	 * Показ индикатора загрузки
	 */
	function showLoadingIndicator(message) {
		const indicator = document.createElement('div');
		indicator.id = 'export-loading';
		indicator.className = 'loading-indicator';
		indicator.innerHTML = `
			<div class="spinner"></div>
			<span>${message}</span>
		`;
		
		// Стили для индикатора
		const style = document.createElement('style');
		style.textContent = `
			#export-loading {
				position: fixed;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				background: rgba(0,0,0,0.8);
				color: white;
				padding: 20px 30px;
				border-radius: 10px;
				display: flex;
				align-items: center;
				gap: 15px;
				z-index: 10000;
				box-shadow: 0 5px 25px rgba(0,0,0,0.3);
			}
			
			.spinner {
				width: 24px;
				height: 24px;
				border: 3px solid rgba(255,255,255,0.3);
				border-top-color: white;
				border-radius: 50%;
				animation: spin 1s linear infinite;
			}
			
			@keyframes spin {
				to { transform: rotate(360deg); }
			}
		`;
		
		document.head.appendChild(style);
		document.body.appendChild(indicator);
	}

	/**
	 * Скрытие индикатора загрузки
	 */
	function hideLoadingIndicator() {
		const indicator = document.getElementById('export-loading');
		if (indicator) {
			indicator.remove();
		}
	}
	
  </script>
  
  <!-- Форма для добавления / редактирования покупок -->
<div id="purchase-modal" class="modal">
    <div class="modal-content compact-form">
        <span class="close-modal">&times;</span>
        <h3 id="purchase-modal-title">📝 Новая покупка</h3>
        
        <form id="purchase-form">
            <input type="hidden" id="purchase-id">
            
            <div class="form-grid">
                <!-- Первая строка -->
                <div class="form-group">
                    <label>Дата покупки</label>
                    <input type="date" id="purchase-date" required>
                </div>
				
                <div class="form-group">
                    <label>Магазин</label>
                    <select id="purchase-store" required>
                        <option value="">Выберите магазин</option>
                    </select>
                </div>
                
                <div class="form-group">
					<label>Категория</label>
					<select id="purchase-category" required>
						<option value="">Выберите категорию</option>
						<!-- Заполнится динамически -->
					</select>
				</div>
				
                <div class="form-group">
                    <label>Название товара</label>
                    <input type="text" id="purchase-name" required placeholder="Например: Молоко">
                </div>
				
				<!-- Вторая строка -->
                <div class="form-group full-width">
                    <label>Характеристики товара</label>
                    <textarea id="purchase-characteristics" placeholder="Вес, объем, особенности товара..." rows="2"></textarea>
                </div>

                <!-- Третья строка - компактная для числовых полей -->
                <div class="form-group">
                    <label>Цена за ед. (₽)</label>
                    <input type="number" id="purchase-price" step="0.01" min="0" required placeholder="0.00">
                </div>
                
                <div class="form-group">
                    <label>Количество</label>
                    <input type="number" id="purchase-quantity" step="0.001" min="0.001" value="1" required placeholder="1.000">
                </div>
                
                <div class="form-group">
                    <label>Единица измерения</label>
                    <select id="purchase-unit" required>
                        <option value="">Единицы</option>
					</select>
                </div>
                
                <div class="form-group">
                    <label>Стоимость (₽)</label>
                    <input type="number" id="purchase-amount" step="0.01" min="0" required placeholder="0.00">
                </div>

                
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn-primary">💾 Сохранить покупку</button>
                <button type="button" id="cancel-purchase" class="btn-secondary">Отмена</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
