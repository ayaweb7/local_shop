<!DOCTYPE html>
<html>
<head>
    <title>Графики - Трекер покупок</title>
    <link href="css/styles.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<!-- <script src="js/chart.min.js"></script> -->
    <script src="js/api.js"></script><!--  -->
	<!-- Chart.js DataLabels плагин -->
	<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
	<script>
		// Регистрируем плагин глобально, если он еще не зарегистрирован
		if (window.Chart && Chart.register) {
			Chart.register(ChartDataLabels);
			console.log('ChartDataLabels plugin registered');
			// По умолчанию отключаем, чтобы не мешал, пока пользователь не включит
			Chart.defaults.plugins.datalabels = {
				display: false
			};
		} else {
			console.error('ChartDataLabels plugin could not be registered');
		}
	</script>
	<!-- Затем ваш charts.js -->
	<script src="js/charts.js"></script>
	<!-- Подключаем менеджер анимаций -->
	<script src="js/chart-animations.js"></script>
	
</head>
<body>
    <header>
        <h1>📊 Графики покупок</h1>
        <nav class="app-nav">
            <button onclick="window.location.href='app.html'" class="btn-secondary">← К таблице</button>
            <button onclick="window.location.href='stats.html'" class="btn-secondary">📈 Статистика</button>
            <button onclick="window.location.href='admin.html'" class="btn-secondary">⚙️ Админ-панель</button>
        </nav>
    </header>
    
    <!-- Фильтры для графиков -->
    <div class="filters-panel">
        <div class="filter-group">
            <label>Период:</label>
            <select id="period-filter">
                <option value="all">Все данные</option>
                <option value="year">Год</option>
                <option value="month">Месяц</option>
            </select>
        </div>
        
        <div class="filter-group" id="year-filter-group" style="display:none;">
            <label>Год:</label>
            <select id="year-filter">
                <!-- Заполнится динамически -->
            </select>
        </div>
        
        <div class="filter-group" id="month-filter-group" style="display:none;">
            <label>Месяц:</label>
            <select id="month-filter">
                <option value="1">Январь</option>
                <option value="2">Февраль</option>
                <option value="3">Март</option>
                <option value="4">Апрель</option>
                <option value="5">Май</option>
                <option value="6">Июнь</option>
                <option value="7">Июль</option>
                <option value="8">Август</option>

        <button id="apply-filters" class="btn-primary">Применить</button>
        <button id="reset-filters" class="btn-secondary">Сбросить</button>
    </div>
	
	<!-- Выбор периодов для сравнения -->
	<div class="comparison-controls" id="comparison-controls" style="display: none;">
		<h3>Настройка сравнения периодов</h3>
		
		<div class="comparison-settings">
			<div class="setting-group">
				<label>Тип сравнения:</label>
				<select id="comparison-type">
					<option value="year">Год vs Год</option>
					<option value="quarter">Квартал vs Квартал</option>

				</select>
			</div>
			
			<div class="periods-selector">
				<div class="period-select">
					<label>Первый период:</label>
					<select id="period1-year">
						<!-- Заполнится динамически -->
					</select>
					<select id="period1-quarter" style="display: none;">
						<option value="1">1 квартал (Янв-Мар)</option>
						<option value="2">2 квартал (Апр-Июн)</option>
						<option value="3">3 квартал (Июл-Сен)</option>
						<option value="4">4 квартал (Окт-Дек)</option>
					</select>
				</div>
				
				<div class="vs-text">vs</div>
				
				<div class="period-select">
					<label>Второй период:</label>
					<select id="period2-year">
						<!-- Заполнится динамически -->
					</select>
					<select id="period2-quarter" style="display: none;">
						<option value="1">1 квартал (Янв-Мар)</option>
						<option value="2">2 квартал (Апр-Июн)</option>
						<option value="3">3 квартал (Июл-Сен)</option>
						<option value="4">4 квартал (Окт-Дек)</option>
					</select>
				</div>
			</div>
			
			<div class="comparison-actions">
				<button id="apply-comparison" class="btn-primary">
					🔄 Применить сравнение
				</button>
				<button id="swap-periods" class="btn-secondary" title="Поменять периоды местами">
					↔️ Поменять местами
				</button>
			</div>
		</div>
		
		<!-- Статистика сравнения -->
		<div class="comparison-stats"></div>
	</div>
    
    <!-- Дашборд графиков -->
    <div class="dashboard">
		<!-- Селектор типа графика -->
		<div class="chart-type-selector">
			<h3>Выберите тип анализа:</h3>
			<div class="chart-types">
				<button class="chart-type-btn active" data-type="categories">📊 По категориям</button>
				<button class="chart-type-btn" data-type="months">📅 По месяцам</button>
				<button class="chart-type-btn" data-type="years">📈 По годам</button>
				<button class="chart-type-btn" data-type="stores">🏪 По магазинам</button>
				<button class="chart-type-btn" data-type="products">🛒 По товарам</button>
				<!-- Кнопка периодов сравнения -->
				<button class="chart-type-btn" data-type="comparison">🥓 Сравнение периодов</button>
				<!-- Кнопка тепловой карты -->
				<button class="chart-type-btn" data-type="heatmap">💦 Тепловая карта</button>
				<!-- Кнопка совмещенного графика -->
				<button class="chart-type-btn" data-type="combo">🎯 Совмещенный график</button>
				<!-- Кнопка специального анализа цен -->
				<button class="chart-type-btn" onclick="window.location.href='price-analysis.html'">💰 Анализ цен</button>
			</div>
		</div>
		
		<!-- Панель управления тепловой картой -->
		<div id="heatmap-controls" class="heatmap-controls" style="display: none;">
			<h3>Настройка тепловой карты</h3>
			
			<div class="heatmap-settings">
				<div class="period-selector">
					<div class="filter-group">
						<label>📅 Месяц:</label>
						<select id="heatmap-month-select">
							<!-- Заполнится динамически -->
						</select>
					</div>
					
					<div class="filter-group">
						<label>📊 Отображать:</label>
						<label class="radio-label">
							<input type="radio" name="heatmap-metric" value="amount" checked>
							Суммы
						</label>
						<label class="radio-label">
							<input type="radio" name="heatmap-metric" value="both">
							Суммы + Количество
						</label>
					</div>
				</div>
				
				<div class="heatmap-legend">
					<div class="color-scale">
						<span>Меньше</span>
						<div class="gradient-box"></div>
						<span>Больше</span>
					</div>
				</div>
			</div>
			
			<!-- Контейнер для статистики -->
			<div class="heatmap-stats"></div>
		</div>
		
		<!-- Панель управления совмещенным графиком -->
		<div id="combo-controls" class="combo-controls" style="display: none;">
			<h3>Настройка совмещенного графика</h3>
			
			<div class="combo-settings">
				<div class="period-selector">
					<div class="filter-group">
						<label>📊 Период:</label>
						<select id="combo-period">
							<option value="month">По месяцам</option>
							<option value="week">По неделям</option>
							<option value="day">По дням</option>
						</select>
					</div>
					
					<div class="filter-group">
						<label>📅 Год:</label>
						<select id="combo-year">
							<option value="">Все годы</option>
							<!-- Заполнится динамически -->
						</select>
					</div>
					
					<div class="filter-group">
						<label>📈 Показать:</label>
						<select id="combo-metric">
							<option value="count">Количество покупок</option>
							<option value="average">Средний чек</option>
						</select>
					</div>
				</div>
				
				<div class="combo-legend">
					<div class="legend-item">
						<span class="color-dot" style="background: #3498db;"></span>
						<span>Сумма расходов</span>
					</div>
					<div class="legend-item">
						<span class="color-dot" style="background: #e74c3c;"></span>
						<span>Количество покупок</span>
					</div>
					<div class="legend-item">
						<span class="color-dot" style="background: #f39c12;"></span>
						<span>Средний чек</span>
					</div>
				</div>
			</div>
			
			<!-- Контейнер для статистики -->
			<div class="combo-stats"></div>
		</div>
		
		<!-- Селектор типа графиков -->
		<div class="chart-view-selector">
			<h3>Тип отображения:</h3>
			<div class="view-types">
				<button class="view-type-btn active" data-view="horizontalBar" title="Горизонтальные гистограммы">
					📊 Горизонтальные
				</button>
				<button class="view-type-btn" data-view="bar" title="Вертикальные гистограммы">
					📈 Вертикальные
				</button>
				<button class="view-type-btn" data-view="pie" title="Круговые диаграммы">
					🥧 Круговые
				</button>
				<button class="view-type-btn" data-view="doughnut" title="Кольцевые диаграммы">
					🍩 Кольцевые
				</button>
			</div>
		</div>
		
		<!-- Кнопки экспорта графиков -->
		<div class="chart-view-selector">
			<h3>Экспорт графиков в формате PNG:</h3>
			<div class="export-controls">
				<button id="export-left" class="btn-export" title="Экспорт левого графика">
					⏪ Левый
				</button>
				<button id="export-right" class="btn-export" title="Экспорт правого графика">
					⏩ Правый
				</button>
				<button id="export-both" class="btn-export" title="Экспорт обоих графиков"> <!-- btn-primary -->
					⏪ ⏩ Два графика
				</button>
				<button id="export-all" class="btn-export" title="Экспорт всех графиков как коллаж"> <!-- btn-secondary -->
					🗺️ Коллаж
				</button>
				<button id="reset-settings" class="btn-export" title="Сбросить настройки"> <!-- btn-secondary -->
					🔄 Сбросить настройки графиков
				</button>
			</div>
		</div>
		
		<!-- Переключатель подписей/процентов -->
		<div class="chart-options">
			<label class="checkbox-label">
				<input type="checkbox" id="show-data-labels" checked>
				Показывать подписи данных
			</label>
			<label class="checkbox-label">
				<input type="checkbox" id="show-percentages">
				Показывать проценты (для круговых)
			</label>
		</div>
		
		<!-- Пара графиков -->
		<div class="charts-pair">
			<div class="chart-container">
				<h3 id="left-chart-title">Распределение расходов</h3>
				<canvas id="left-chart"></canvas>
			</div>
			
			<div class="chart-container">
				<h3 id="right-chart-title">Количество покупок</h3>
				<canvas id="right-chart"></canvas>
			</div>
		</div>
	</div>
    
	<script>
		let chartManager;
		let unifiedProcessor;
		let currentChartType = 'categories';
		let currentFilter = 'all';
		let currentYear = null;
		let currentMonth = null;
		let currentViewType = 'horizontalBar';
		let showDataLabels = true;
		let showPercentages = false;
		let comparisonSettings = {
			type: 'year',
			year1: null,
			year2: null,
			quarter1: null,
			quarter2: null
		};
		let currentHeatmapMonth = null;
		let currentComboPeriod = 'month';
		let currentComboYear = '';
		let currentComboMetric = 'count';
		let settingsManager;
		let performanceOptimizer;
		
		// DOMContentLoaded
		document.addEventListener('DOMContentLoaded', async () => {
			console.log('Charts page initialized');
			
			// Инициализация
			chartManager = window.chartManager;
			unifiedProcessor = new UnifiedDataProcessor();
			
			// Загружаем менеджеры
			settingsManager = window.settingsManager;
			performanceOptimizer = window.performanceOptimizer;
			
			// Оптимизация ресайза
			if (performanceOptimizer) {
				performanceOptimizer.optimizeResize();
				performanceOptimizer.setupLazyLoading();
			}
			
			// Загрузка данных
			await loadData();
			
			// Настройка фильтров
			setupFilters();
			
			// Создание начальных графиков
			updateCharts();
			
			// Обработчики переключения типов графиков
			setupChartTypeButtons();
			setupViewTypeButtons();
			
			// Обработчики экспорта
			setupExportControls();
			setupChartOptions(); // Для чекбоксов
			
			// Обработчик сравнения
			setupComparisonControls();
			
			// Тепловая карта
			setupHeatmapControls();
			
			// Совмещенный график
			setupComboControls();
			
			// Применяем сохраненные настройки
			if (settingsManager) {
				settingsManager.applyToUI();
			}
			
			// Настраиваем автосохранение при изменениях
			setupAutoSave();
		});
		
		// Добавляем эффекты при наведении на кнопки
		document.querySelectorAll('.chart-type-btn, .btn-primary, .btn-secondary').forEach(btn => {
			btn.addEventListener('click', function(e) {
				if (window.animationManager) {
					window.animationManager.createRipple(e, this);
				}
			});
		});
		
		// Анимируем появление графиков
		document.addEventListener('chartsCreated', function() {
			const charts = document.querySelectorAll('canvas');
			charts.forEach(canvas => {
				canvas.classList.add('chart-appear');
			});
		});
		
		// Плавная прокрутка к выбранному графику
		document.querySelectorAll('a[href^="#"]').forEach(anchor => {
			anchor.addEventListener('click', function(e) {
				e.preventDefault();
				const target = document.querySelector(this.getAttribute('href'));
				if (target && window.animationManager) {
					window.animationManager.smoothScrollTo(target);
				}
			});
		});
		
		
		async function loadData() {
			try {
				window.chartData = {
					purchases: await apiClient.getPurchases(),
					categories: await apiClient.getCategories(),
					stores: await apiClient.getStores()
				};
				
				console.log('Данные загружены:', {
					purchases: window.chartData.purchases?.length,
					categories: window.chartData.categories?.length,
					stores: window.chartData.stores?.length
				});
				
				// Обновляем список годов в фильтрах
				updateYearFilter();
				
			} catch (error) {
				console.error('Ошибка загрузки данных:', error);
			}
		}
		
		function setupFilters() {
			const periodFilter = document.getElementById('period-filter');
			const yearFilter = document.getElementById('year-filter');
			const monthFilter = document.getElementById('month-filter');
			const applyBtn = document.getElementById('apply-filters');
			const resetBtn = document.getElementById('reset-filters');
			
			periodFilter.addEventListener('change', function() {
				const value = this.value;
				const yearGroup = document.getElementById('year-filter-group');
				const monthGroup = document.getElementById('month-filter-group');
				
				if (value === 'year') {
					yearGroup.style.display = 'block';
					monthGroup.style.display = 'none';
					currentFilter = 'year';
				} else if (value === 'month') {
					yearGroup.style.display = 'block';
					monthGroup.style.display = 'block';
					currentFilter = 'month';
				} else {
					yearGroup.style.display = 'none';
					monthGroup.style.display = 'none';
					currentFilter = 'all';
				}
			});
			
			applyBtn.addEventListener('click', updateCharts);
			resetBtn.addEventListener('click', function() {
				periodFilter.value = 'all';
				document.getElementById('year-filter-group').style.display = 'none';
				document.getElementById('month-filter-group').style.display = 'none';
				currentFilter = 'all';
				currentYear = null;
				currentMonth = null;
				updateCharts();
			});
		}
		
		function updateYearFilter() {
			if (!window.chartData || !window.chartData.purchases) return;
			
			const years = unifiedProcessor.getAvailableYears(window.chartData.purchases);
			const yearSelect = document.getElementById('year-filter');
			
			yearSelect.innerHTML = '<option value="">Выберите год</option>';
			years.forEach(year => {
				yearSelect.innerHTML += `<option value="${year}">${year}</option>`;
			});
		}
		
		function updateMonthFilter() {
			if (!window.chartData || !window.chartData.purchases) return;
			
			const yearSelect = document.getElementById('year-filter');
			const selectedYear = yearSelect.value;
			const monthSelect = document.getElementById('month-filter');
			
			if (!selectedYear) {
				// Если год не выбран, показываем все месяцы
				monthSelect.innerHTML = '<option value="">Выберите месяц</option>';
				for (let i = 1; i <= 12; i++) {
					monthSelect.innerHTML += `<option value="${i}">${monthNames[i-1]}</option>`;
				}
				return;
			}
			
			// Получаем только месяцы, которые есть в данных для выбранного года
			const availableMonths = unifiedProcessor.getAvailableMonths(
				window.chartData.purchases, 
				selectedYear
			);
			
			monthSelect.innerHTML = '<option value="">Выберите месяц</option>';
			availableMonths.forEach(month => {
				monthSelect.innerHTML += `<option value="${month.value}">${month.name}</option>`;
			});
		}

		// Добавьте обработчик изменения года
		document.getElementById('year-filter').addEventListener('change', function() {
			updateMonthFilter();
			// Можно автоматически применить фильтр
			// updateCharts();
		});
		
		function setupChartTypeButtons() {
			document.querySelectorAll('.chart-type-btn').forEach(btn => {
				btn.addEventListener('click', function() {
					// Снимаем активный класс со всех кнопок
					document.querySelectorAll('.chart-type-btn').forEach(b => {
						b.classList.remove('active');
					});
					
					// Добавляем активный класс текущей кнопке
					this.classList.add('active');
					
					// Обновляем текущий тип
					currentChartType = this.dataset.type;
					
					// Обновляем графики
					updateCharts();
				});
			});
		}
		
		function updateCharts() {
			console.log(`Обновление графиков: тип=${currentChartType}, фильтр=${currentFilter}`);
			
			if (!window.chartData || !window.chartData.purchases) {
				console.warn('Нет данных для графиков');
				return;
			}
			
			// УНИЧТОЖАЕМ старую пару графиков перед созданием новой
			chartManager.destroyChartPair('left-chart', 'right-chart');
			
			// Фильтруем данные
			let filteredPurchases = [...window.chartData.purchases];
			
			if (currentFilter === 'year') {
				const yearSelect = document.getElementById('year-filter');
				currentYear = yearSelect.value;
				if (currentYear) {
					filteredPurchases = unifiedProcessor.filterByYear(filteredPurchases, currentYear);
				}
			} else if (currentFilter === 'month') {
				const yearSelect = document.getElementById('year-filter');
				const monthSelect = document.getElementById('month-filter');
				currentYear = yearSelect.value;
				currentMonth = monthSelect.value;
				if (currentYear && currentMonth) {
					filteredPurchases = unifiedProcessor.filterByYearMonth(
						filteredPurchases, 
						currentYear, 
						currentMonth
					);
				}
			}
			
			console.log(`После фильтрации: ${filteredPurchases.length} покупок`);
			
			// Создаем графики в зависимости от типа
			switch(currentChartType) {
				case 'categories':
					createCategoryCharts(filteredPurchases);
					break;
				case 'months':
					createMonthlyCharts(filteredPurchases);
					break;
				case 'years':
					createYearlyCharts(filteredPurchases);
					break;
				case 'stores':
					createStoreCharts(filteredPurchases);
					break;
				case 'products':
					createProductCharts(filteredPurchases);
					break;
			}
		}
		
		function createCategoryCharts(purchases) {
			console.log('Создание графиков по категориям, тип:', currentViewType);
			
			chartManager.createCategoryPair(
				{ left: 'left-chart', right: 'right-chart' },
				purchases,
				window.chartData.categories,
				{
					limit: 25, // Показываем топ-25 категорий
					type: currentViewType // Используем выбранный тип
					// dataType: 'categories' Важно для фильтрации!
				}
			);
		}
		
		function createMonthlyCharts(purchases) {
			console.log('Создание графиков по месяцам, тип:', currentViewType);
			
			// Определяем, какой тип графика допустим для месяцев
			let allowedType = currentViewType;
			// Для месяцев не подходят круговые и кольцевые
			// if (allowedType === 'pie' || allowedType === 'doughnut') {
			// 	allowedType = 'bar'; // По умолчанию вертикальная
			// }
			
			chartManager.createMonthlyPair(
				{ left: 'left-chart', right: 'right-chart' },
				purchases,

		// Обновление всех графиков
		function updateAllChartsDataLabels() {
			if (!window.chartManager) return;
			
			// Обновляем все графики
			window.chartManager.charts.forEach((chart, canvasId) => {
				updateChartDataLabels(chart);
			});
			
			// Обновляем пары графиков
			window.chartManager.chartPairs.forEach(pair => {
				if (pair.leftChart) updateChartDataLabels(pair.leftChart);
				if (pair.rightChart) updateChartDataLabels(pair.rightChart);
			});
		}
		
		// Проценты для круговых диаграмм
		function updateChartDataLabels(chartInstance) {
			if (!chartInstance || !chartInstance.chart) return;
			
			const chart = chartInstance.chart;
			const config = chart.config;
			
			if (!config.options.plugins) config.options.plugins = {};
			if (!config.options.plugins.datalabels) config.options.plugins.datalabels = {};
			
			// Обновляем видимость
			config.options.plugins.datalabels.display = showDataLabels;
			
			// Для круговых диаграмм добавляем проценты
			if (config.type === 'pie' || config.type === 'doughnut') {
				config.options.plugins.datalabels.formatter = (value, context) => {
					if (showPercentages) {
						const total = context.dataset.data.reduce((a, b) => a + b, 0);
						const percentage = total > 0 ? Math.round((value / total) * 100) : 0;
						return percentage + '%';
					} else {
						// Округленное значение
						return ChartUtils.formatCurrency(value, '', 0);
					}
				};
			}
			
			chart.update();
		}

		function updateDataLabels() {
			// Обновляем все активные графики
			chartManager.updateAllChartsDataLabels();
		}

		// Добавляем в ChartManager метод для обновления подписей
		ChartManager.prototype.updateAllChartsDataLabels = function() {
			this.charts.forEach((chart, canvasId) => {
				this.updateChartDataLabels(canvasId);
			});
			
			this.chartPairs.forEach((pair, key) => {
				if (pair.leftChart) {
					this.updateChartDataLabels(pair.leftCanvasId);
				}
				if (pair.rightChart) {
					this.updateChartDataLabels(pair.rightCanvasId);
				}
			});
		};

		ChartManager.prototype.updateChartDataLabels = function(canvasId) {
			const chart = this.getChart(canvasId);
			if (!chart || !chart.config || !chart.config.options.plugins) return;
			
			const datalabels = chart.config.options.plugins.datalabels;
			if (!datalabels) return;
			
			// Обновляем видимость
			datalabels.display = showDataLabels;
			
			// Обновляем форматтер для круговых диаграмм
			if (chart.config.type === 'pie' || chart.config.type === 'doughnut') {
				datalabels.formatter = (value, context) => {
					if (showPercentages) {
						const total = context.dataset.data.reduce((a, b) => a + b, 0);
						const percentage = total > 0 ? Math.round((value / total) * 100) : 0;
						return `${ChartUtils.formatCurrency(value, '', 0)}\n(${percentage}%)`;
					}
					return ChartUtils.formatCurrency(value, '', 0);
				};
			}
			
			// Обновляем график
			chart.update();
		};

		// ФУНКЦИИ для работы со сравнением:
		function setupComparisonControls() {
			const comparisonTypeSelect = document.getElementById('comparison-type');
			const period1YearSelect = document.getElementById('period1-year');
			const period2YearSelect = document.getElementById('period2-year');
			const period1QuarterSelect = document.getElementById('period1-quarter');
			const period2QuarterSelect = document.getElementById('period2-quarter');
			const applyBtn = document.getElementById('apply-comparison');
			const swapBtn = document.getElementById('swap-periods');
			
			// Заполняем списки годов
			function populateYearSelects() {
				if (!window.chartData || !window.chartData.purchases) return;
				
				const years = unifiedProcessor.getAvailableYearsForComparison(window.chartData.purchases);
				
				period1YearSelect.innerHTML = years.map(year => 
					`<option value="${year}">${year} год</option>`
				).join('');
				
				period2YearSelect.innerHTML = years.map(year => 
					`<option value="${year}">${year} год</option>`
				).join('');
				
				// Устанавливаем текущий и прошлый год по умолчанию
				if (years.length >= 2) {
					// Автоматически выбираем последние два года с данными
					period1YearSelect.value = years[0];
					period2YearSelect.value = years[1];
					
					comparisonSettings.year1 = parseInt(years[0]);
					comparisonSettings.year2 = parseInt(years[1]);
					
					console.log(`Автовыбор периодов: ${years[0]} vs ${years[1]}`);
				}
			}
			
			// Обработчик изменения типа сравнения
			comparisonTypeSelect.addEventListener('change', function() {
				const type = this.value;
				comparisonSettings.type = type;
				
				// Показываем/скрываем квартальные селекторы
				const showQuarterSelects = type === 'quarter';
				period1QuarterSelect.style.display = showQuarterSelects ? 'block' : 'none';
				period2QuarterSelect.style.display = showQuarterSelects ? 'block' : 'none';
			});
			
			// Обработчики изменения периодов
			period1YearSelect.addEventListener('change', function() {
				comparisonSettings.year1 = parseInt(this.value);
			});
			
			period2YearSelect.addEventListener('change', function() {
				comparisonSettings.year2 = parseInt(this.value);
			});
			
			period1QuarterSelect.addEventListener('change', function() {
				comparisonSettings.quarter1 = parseInt(this.value);
			});
			
			period2QuarterSelect.addEventListener('change', function() {
				comparisonSettings.quarter2 = parseInt(this.value);
			});
			
			// Кнопка применения сравнения
			applyBtn.addEventListener('click', function() {
				if (!comparisonSettings.year1 || !comparisonSettings.year2) {
					alert('Выберите оба периода для сравнения');
					return;
				}
				
				if (comparisonSettings.year1 === comparisonSettings.year2) {
					alert('Выберите разные периоды для сравнения');
					return;
				}
				
				updateCharts();
			});
			
			// Кнопка смены периодов местами
			swapBtn.addEventListener('click', function() {
				const tempYear = comparisonSettings.year1;
				comparisonSettings.year1 = comparisonSettings.year2;
				comparisonSettings.year2 = tempYear;
				
				const tempQuarter = comparisonSettings.quarter1;
				comparisonSettings.quarter1 = comparisonSettings.quarter2;
				comparisonSettings.quarter2 = tempQuarter;
				
				// Обновляем селекты
				period1YearSelect.value = comparisonSettings.year1;
				period2YearSelect.value = comparisonSettings.year2;
				
				if (comparisonSettings.type === 'quarter') {
					period1QuarterSelect.value = comparisonSettings.quarter1;
					period2QuarterSelect.value = comparisonSettings.quarter2;
				}
				
				updateCharts();
			});
			
			// Заполняем списки при загрузке данных
			setTimeout(populateYearSelects, 1000);
		}

		// Обновляем функцию updateCharts для поддержки сравнения:
		function updateCharts() {
			console.log(`Обновление графиков: тип=${currentChartType}, фильтр=${currentFilter}`);
			
			if (!window.chartData || !window.chartData.purchases) {
				console.warn('Нет данных для графиков');
				return;
			}
			
			// Уничтожаем старую пару графиков
			chartManager.destroyChartPair('left-chart', 'right-chart');
			
			// Фильтруем данные (для обычных графиков)
			let filteredPurchases = [...window.chartData.purchases];
			
			if (currentFilter === 'year') {
				const yearSelect = document.getElementById('year-filter');
				currentYear = yearSelect.value;
				if (currentYear) {
					filteredPurchases = unifiedProcessor.filterByYear(filteredPurchases, currentYear);
				}
			} else if (currentFilter === 'month') {
				const yearSelect = document.getElementById('year-filter');
				const monthSelect = document.getElementById('month-filter');
				currentYear = yearSelect.value;
				currentMonth = monthSelect.value;
				if (currentYear && currentMonth) {
					filteredPurchases = unifiedProcessor.filterByYearMonth(
						filteredPurchases, 
						currentYear, 
						currentMonth
					);
				}
			}
			
			// Показываем/скрываем панель СРАВНЕНИЯ
			const comparisonControls = document.getElementById('comparison-controls');
			if (currentChartType === 'comparison') {
				comparisonControls.style.display = 'block';
			} else {
				comparisonControls.style.display = 'none';
			}
			
			// Показываем/скрываем панели СРАВНЕНИЯ в зависимости от типа
			document.getElementById('comparison-controls').style.display = 
				currentChartType === 'comparison' ? 'block' : 'none';
			document.getElementById('heatmap-controls').style.display = 
				currentChartType === 'heatmap' ? 'block' : 'none';
				
			// Показываем/скрываем панели СОВМЕЩЁННОГО ГРАФИКА в зависимости от типа
			document.getElementById('comparison-controls').style.display = 
				currentChartType === 'comparison' ? 'block' : 'none';
			document.getElementById('heatmap-controls').style.display = 
				currentChartType === 'heatmap' ? 'block' : 'none';
			document.getElementById('combo-controls').style.display = 
				currentChartType === 'combo' ? 'block' : 'none';
			
			// Создаем графики в зависимости от типа
			switch(currentChartType) {
				case 'categories':
					createCategoryCharts(filteredPurchases);
					break;
				case 'months':
					createMonthlyCharts(filteredPurchases);
					break;
				case 'years':
					createYearlyCharts(filteredPurchases);
					break;
				case 'stores':
					createStoreCharts(filteredPurchases);
					break;
				case 'products':
					createProductCharts(filteredPurchases);
					break;
				case 'comparison':
					createComparisonCharts(window.chartData.purchases); // Используем все данные для сравнения
					break;
				case 'heatmap':
					createHeatmapCharts(window.chartData.purchases);
					break;
				case 'combo':
					createComboCharts(window.chartData.purchases);
					break;
			}
		}

		function createComparisonCharts(purchases) {
			console.log('Создание графиков сравнения периодов', comparisonSettings);
			
			if (!comparisonSettings.year1 || !comparisonSettings.year2) {
				console.warn('Не выбраны периоды для сравнения');
				return;
			}
			
			chartManager.createComparisonPair(
				{ left: 'left-chart', right: 'right-chart' },
				purchases,
				{
					type: currentViewType === 'pie' ? 'line' : currentViewType, // Круговые не подходят для сравнения
					year1: comparisonSettings.year1,
					year2: comparisonSettings.year2,
					quarter1: comparisonSettings.quarter1,
					quarter2: comparisonSettings.quarter2,
					comparisonType: comparisonSettings.type
				}
			);
		}
		
		// Валидация выбранных периодов:
		function validateComparisonSettings() {
			if (comparisonSettings.year1 === comparisonSettings.year2) {
				return {
					valid: false,
					message: 'Выберите разные годы для сравнения'
				};
			}
			
			// Проверяем, есть ли данные для выбранных годов
			const year1Data = window.chartData.purchases.filter(p => 
				new Date(p.date).getFullYear() === comparisonSettings.year1
			);
			const year2Data = window.chartData.purchases.filter(p => 
				new Date(p.date).getFullYear() === comparisonSettings.year2
			);
			
			if (year1Data.length === 0) {
				return {
					valid: false,
					message: `Нет данных за ${comparisonSettings.year1} год`
				};
			}
			
			if (year2Data.length === 0) {
				return {
					valid: false,
					message: `Нет данных за ${comparisonSettings.year2} год`
				};
			}
			
			return { valid: true };
		}

		// Дополнительный мини-дашборд с ключевыми показателями
		function addComboKPIs(meta) {
			const kpiContainer = document.querySelector('.combo-kpis');
			if (!kpiContainer) return;
			
			// Рассчитываем тренд
			const firstHalf = meta.amountCountData.datasets[0].data.slice(0, Math.floor(meta.periodsCount / 2));
			const secondHalf = meta.amountCountData.datasets[0].data.slice(Math.floor(meta.periodsCount / 2));
			
			const firstAvg = firstHalf.reduce((a, b) => a + b, 0) / firstHalf.length;
			const secondAvg = secondHalf.reduce((a, b) => a + b, 0) / secondHalf.length;
			
			const trend = secondAvg - firstAvg;
			const trendPercent = firstAvg > 0 ? ((trend / firstAvg) * 100).toFixed(1) : 0;
			const trendIcon = trend > 0 ? '📈' : '📉';
			const trendClass = trend > 0 ? 'positive' : 'negative';
			
			kpiContainer.innerHTML = `
				<div class="kpi-grid">
					<div class="kpi-card">
						<div class="kpi-icon">💰</div>
						<div class="kpi-label">Всего расходов</div>
						<div class="kpi-value">${ChartUtils.formatCurrency(meta.totalAmount)}</div>
						<div class="kpi-trend ${trendClass}">
							${trendIcon} ${Math.abs(trendPercent)}% ${trend > 0 ? 'рост' : 'снижение'}
						</div>
					</div>
					<div class="kpi-card">
						<div class="kpi-icon">🛒</div>
						<div class="kpi-label">Всего покупок</div>
						<div class="kpi-value">${ChartUtils.formatNumber(meta.totalCount, 0)}</div>
						<div class="kpi-sub">${ChartUtils.formatCurrency(meta.overallAverage)} средний чек</div>
					</div>
					<div class="kpi-card">
						<div class="kpi-icon">📊</div>
						<div class="kpi-label">Пик расходов</div>
						<div class="kpi-value">${ChartUtils.formatCurrency(meta.maxAmount)}</div>
						<div class="kpi-sub">Макс. покупок: ${ChartUtils.formatNumber(meta.maxCount, 0)}</div>
					</div>
				</div>
			`;
		}

		// Вспомогательная функция для названий периодов
		function getPeriodNameRu(period) {
			const names = {
				'day': 'по дням',
				'week': 'по неделям',
				'month': 'по месяцам'
			};
			return names[period] || period;
		}
		
		// Анимация статистики при обновлении
		function animateStatsOnUpdate() {
			const statsValues = document.querySelectorAll('.stat-value[data-animate]');
			statsValues.forEach(stat => {
				const value = parseFloat(stat.textContent.replace(/[^\d.-]/g, ''));
				if (!isNaN(value) && window.animationManager) {
					stat.dataset.type = stat.textContent.includes('₽') ? 'currency' : 'number';
					window.animationManager.animateStatsValue(stat, 0, value, 800);
				}
			});
		}
		
		// Вызываем при загрузке страницы
		setTimeout(animateStatsOnUpdate, 500);
		
		// Автосохранение настроек
		function setupAutoSave() {
			const saveEvents = [
				'click', 'change', 'input'
			];
			
			const saveHandler = () => {
				if (settingsManager) {
					settingsManager.captureFromUI();
				}
			};
			
			// Сохраняем при кликах на кнопки типов
			document.querySelectorAll('.chart-type-btn, .view-type-btn').forEach(btn => {
				btn.addEventListener('click', () => {
					setTimeout(saveHandler, 100);
				});
			});
			
			// Сохраняем при изменении фильтров
			document.getElementById('period-filter')?.addEventListener('change', saveHandler);
			document.getElementById('year-filter')?.addEventListener('change', saveHandler);
			document.getElementById('month-filter')?.addEventListener('change', saveHandler);
			
			// Сохраняем при изменении чекбоксов
			document.getElementById('show-data-labels')?.addEventListener('change', saveHandler);
			document.getElementById('show-percentages')?.addEventListener('change', saveHandler);
			
			// Сохраняем перед уходом со страницы
			window.addEventListener('beforeunload', () => {
				if (settingsManager) {
					settingsManager.captureFromUI();
				}
			});
		}

		// Кнопка сброса настроек
		document.getElementById('reset-settings')?.addEventListener('click', () => {
			if (settingsManager && confirm('Сбросить все настройки к значениям по умолчанию?')) {
				settingsManager.resetSettings();
				settingsManager.applyToUI();
				location.reload();
			}
		});

		// Предзагрузка данных при наведении
		document.querySelectorAll('.chart-type-btn').forEach(btn => {
			btn.addEventListener('mouseenter', () => {
				const type = btn.dataset.type;
				if (performanceOptimizer) {
					performanceOptimizer.prefetchData(type);
				}
			});
		});

		// Ленивая загрузка графиков
		document.addEventListener('lazyload-chart', (e) => {
			const { canvasId } = e.detail;
			console.log(`Загрузка графика: ${canvasId}`);
			// Здесь код загрузки конкретного графика
		});
		
	</script>
