<!DOCTYPE html>
<html>
<head>
    <title>Графики - Трекер покупок</title>
    <link href="css/styles.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<!-- <script src="js/chart.min.js"></script> -->
    <script src="js/api.js"></script>
    <script src="js/charts.js"></script>
</head>
<body>
    <header>
        <h1>📊 Графики покупок</h1>
        <nav class="app-nav">
            <button onclick="window.location.href='app.html'" class="btn-secondary">← К таблице</button>
            <button onclick="window.location.href='stats.html'" class="btn-secondary">📈 Статистика</button>
            <button onclick="window.location.href='admin.html'" class="btn-secondary">⚙️ Админ-панель</button>
        </nav>
    </header>
    
    <!-- Фильтры для графиков -->
    <div class="filters-panel">
        <div class="filter-group">
            <label>Период:</label>
            <select id="period-filter">
                <option value="all">Все данные</option>
                <option value="year">Год</option>
                <option value="month">Месяц</option>
            </select>
        </div>
        
        <div class="filter-group" id="year-filter-group" style="display:none;">
            <label>Год:</label>
            <select id="year-filter">
                <!-- Заполнится динамически -->
            </select>
        </div>
        
        <div class="filter-group" id="month-filter-group" style="display:none;">
            <label>Месяц:</label>
            <select id="month-filter">
                <option value="1">Январь</option>
                <option value="2">Февраль</option>
                <option value="3">Март</option>
                <option value="4">Апрель</option>
                <option value="5">Май</option>
                <option value="6">Июнь</option>
                <option value="7">Июль</option>
                <option value="8">Август</option>
                <option value="9">Сентябрь</option>
                <option value="10">Октябрь</option>
                <option value="11">Ноябрь</option>
                <option value="12">Декабрь</option>
            </select>
        </div>
        
        <button id="apply-filters" class="btn-primary">Применить</button>
        <button id="reset-filters" class="btn-secondary">Сбросить</button>
    </div>
    
    <!-- Дашборд графиков -->
    <!-- Замените весь dashboard на: -->
	<div class="dashboard">
		<!-- Селектор типа графика -->
		<div class="chart-type-selector">
			<h3>Выберите тип анализа:</h3>
			<div class="chart-types">
				<button class="chart-type-btn active" data-type="categories">📊 По категориям</button>
				<button class="chart-type-btn" data-type="months">📅 По месяцам</button>
				<button class="chart-type-btn" data-type="years">📈 По годам</button>
				<button class="chart-type-btn" data-type="stores">🏪 По магазинам</button>
				<button class="chart-type-btn" data-type="products">🛒 По товарам</button>
			</div>
		</div>
		
		<!-- Добавьте кнопки для тестирования: -->
		<div class="test-controls">
			<button onclick="testBarChart()">Тест Bar Chart</button>
			<button onclick="testPieChart()">Тест Pie Chart</button>
			<button onclick="testExport()">Тест Экспорт PNG</button>
		</div>
		
		<!-- Два графика -->
		<div class="charts-pair">
			<div class="chart-container">
				<h3 id="left-chart-title">Распределение расходов</h3>
				<canvas id="left-chart"></canvas>
			</div>
			
			<div class="chart-container">
				<h3 id="right-chart-title">Количество покупок</h3>
				<canvas id="right-chart"></canvas>
			</div>
		</div>
	</div>
    
    <script>
		let currentChartType = 'categories';
		let chartData = {};
		
		// Инициализация при загрузке
		document.addEventListener('DOMContentLoaded', async () => {
			console.log('Charts page loaded');
			
			// Загружаем данные
			await loadData();
			
			// Создаем начальные графики
			createCategoryCharts();
			
			// Обработчики для переключения типов графиков
			document.querySelectorAll('.chart-type-btn').forEach(btn => {
				btn.addEventListener('click', function() {
					document.querySelectorAll('.chart-type-btn').forEach(b => b.classList.remove('active'));
					this.classList.add('active');
					
					currentChartType = this.dataset.type;
					updateCharts();
				});
			});
			
			// Обработчики фильтров
			document.getElementById('apply-filters').addEventListener('click', updateCharts);
			document.getElementById('reset-filters').addEventListener('click', resetFilters);
		});
		
		async function loadData() {
			try {
				chartData.purchases = await apiClient.getPurchases();
				chartData.categories = await apiClient.getCategories();
				chartData.stores = await apiClient.getStores();
				
				console.log('Данные загружены:', {
					purchases: chartData.purchases?.length,
					categories: chartData.categories?.length,
					stores: chartData.stores?.length
				});
			} catch (error) {
				console.error('Ошибка загрузки данных:', error);
				alert('Не удалось загрузить данные для графиков');
			}
		}
		
		function createCategoryCharts() {
			if (!chartData.purchases || !chartData.categories) {
				console.warn('Нет данных для графиков');
				return;
			}
			
			console.log('Создание графиков категорий...');
			
			// Левый график - столбчатая диаграмма
			try {
				const leftChart = chartManager.createCategoryChart(
					'left-chart',
					chartData.purchases,
					chartData.categories,
					'bar'
				);
				console.log('Левый график создан:', leftChart ? 'success' : 'failed');
				
				// Обновляем заголовок
				document.getElementById('left-chart-title').textContent = 'Расходы по категориям (столбчатая)';
			} catch (error) {
				console.error('Ошибка создания левого графика:', error);
			}
			
			// Правый график - круговая диаграмма
			try {
				const rightChart = chartManager.createCategoryChart(
					'right-chart',
					chartData.purchases,
					chartData.categories,
					'pie'
				);
				console.log('Правый график создан:', rightChart ? 'success' : 'failed');
				
				// Обновляем заголовок
				document.getElementById('right-chart-title').textContent = 'Распределение расходов (круговая)';
			} catch (error) {
				console.error('Ошибка создания правого графика:', error);
			}
		}
		
		function updateCharts() {
			// Уничтожаем старые графики
			chartManager.destroyChart('left-chart');
			chartManager.destroyChart('right-chart');
			
			// Создаем новые в зависимости от типа
			switch(currentChartType) {
				case 'categories':
					createCategoryCharts();
					break;
				case 'months':
					createMonthlyCharts();
					break;
				case 'stores':
					createStoreCharts();
					break;
				// ... другие типы
			}
		}
		
		function resetFilters() {
			document.getElementById('period-filter').value = 'all';
			document.getElementById('year-filter-group').style.display = 'none';
			document.getElementById('month-filter-group').style.display = 'none';
			updateCharts();
		}
		
		function createMonthlyCharts() {
			// Левый график - столбчатая диаграмма
			const leftChart = chartManager.createMonthlyChart(
				'left-chart',
				chartData.purchases,
				'bar'
			);
			
			document.getElementById('left-chart-title').textContent = 'Месячные расходы';
			
			// Правый график - линейный график тренда
			try {
				const rightChart = chartManager.createChartFromFactory(
					'right-chart',
					'expense-trend',
					{ purchases: chartData.purchases },
					{ 
						title: 'Динамика расходов',
						period: 'monthly'
					}
				);
				document.getElementById('right-chart-title').textContent = 'Динамика расходов';
			} catch (error) {
				console.error('Ошибка создания графика тренда:', error);
			}
		}

		function createStoreCharts() {
			// График сравнения магазинов
			const leftChart = chartManager.createStoreChart(
				'left-chart',
				chartData.purchases,
				chartData.stores,
				'bar'
			);
			
			document.getElementById('left-chart-title').textContent = 'Расходы по магазинам';
			document.getElementById('right-chart-title').textContent = 'Сравнение магазинов';
		}
	</script>

</body>
</html>
